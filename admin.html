<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8fd"><title>Friend Deck Admin</title><style>

</style></head><body><header>FRIEND <span>DECK</span> · ADMIN</header><main>
<section id="login" class="panel login"><div class="tag">PRIVATE CONTROL PANEL</div><h1>Admin access</h1><p>Enter the admin passcode to view active online rooms and players.</p><form id="loginForm"><input id="passcode" class="field" type="password" autocomplete="current-password" placeholder="Admin passcode" required><button class="btn primary">Unlock dashboard</button> <button class="btn soft" type="button" id="toggle">Show</button></form><div id="error"></div></section>
